name: CI

# galactus's own checks. The render matrix (every copier profile rendered,
# linted and tested) lives in test-render.yml; this workflow covers what that
# one does not: the repo's own suite (runs/, review/, experiments/, ml/), the
# template's static path checks, and lint of the scaffold as rendered.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder credentials — tests must not reach a live API.
      ANTHROPIC_API_KEY: "test-key-not-real"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      # default-groups in pyproject.toml pulls dev + ml; without ml the
      # tests/unit/ml suite fails at collection.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv tool install copier
      - run: uv sync --locked --only-group dev
      # validate_paths.py: _tasks paths, orphans, shared-skill/hook symlinks
      # (SHARED_FORKED catches a template copy re-forked from root canon).
      - run: make test
      - run: UV_NO_SYNC=1 uv run make lint
      # Renders the defaults and ml profiles and runs each render's own
      # `make lint-check` — the only lint the Jinja scaffold gets before push.
      - run: make lint-render
