name: Dependabot auto-merge
on:
  pull_request:
  workflow_call:
    inputs:
      pr_url:
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event_name == 'workflow_call' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ inputs.pr_url || github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
