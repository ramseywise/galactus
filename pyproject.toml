[project]
name = "galactus"
version = "0.1.0"
description = "Constrained collateral generation — LLM content behind a deterministic layout contract"
readme = "README.md"
authors = [
    { name = "ramseywise", email = "ramsey.wise@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "seaborn>=0.13.2",
]
ml = [
    "catboost>=1.2.10",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
]

# No [build-system]: galactus is not a distributable package. The code under
# `pocs/ai/marketing-comms/` is a case study read in place, not an importable library —
# declaring a build backend made `uv sync` fail looking for `src/galactus/`, which
# blocked installing the dev tools too.

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# .claude/ ships vendored skills and specs (see CLAUDE.md "Vendoring exception") —
# rendered payload whose canon lives upstream, not code this project lints.
# `ml/` is the same case: vendored from ai-project-template's ML payload. Fix lint
# findings upstream and re-vendor, rather than diverging the copy here.
extend-exclude = [".claude", "ml"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
# E501: ruff-format owns line length; RUF001-003: typographic unicode in prose;
# N803/N806: ML naming conventions (X, y, X_train)
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["pocs/ai/marketing-comms/tests", "review/tests", "tests/unit/ml"]
asyncio_mode = "auto"
# `package = false` means nothing installs `galactus` into the venv, so the import root
# has to be declared here. `pocs/ai/marketing-comms/` is on the path too: `evals/` is a
# script directory imported as `evals.run` by the case study's `tests/test_evals.py`.
# `.` puts the repo root on the path so `ml/` imports as `ml.*` — the vendored ML
# payload's internal imports are absolute (`from ml.selection.registry import ...`).
pythonpath = ["pocs/ai/marketing-comms/src", "pocs/ai/marketing-comms", "."]
