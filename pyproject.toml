[project]
name = "galactus"
version = "0.1.0"
description = "Constrained collateral generation — LLM content behind a deterministic layout contract"
readme = "README.md"
authors = [
    { name = "ramseywise", email = "ramsey.wise@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# No [build-system]: galactus is not a distributable package. The code under `ml6/` is a
# case study read in place, not an importable library — declaring a build backend made
# `uv sync` fail looking for `src/galactus/`, which blocked installing the dev tools too.

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["ml6/tests"]
asyncio_mode = "auto"
