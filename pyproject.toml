[project]
name = "galactus"
version = "0.1.0"
description = "Constrained collateral generation — LLM content behind a deterministic layout contract"
readme = "README.md"
authors = [
    { name = "ramseywise", email = "ramsey.wise@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "numpy>=2.5.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "seaborn>=0.13.2",
    "uvicorn>=0.30",
]
# `runs/ml/customer segmentation/` and `tests/unit/ml` import these directly. They
# already resolved transitively, which meant the POC's imports worked by accident;
# declaring them makes the dependency real. Contrast `runs/ml/fraud/`, which keeps a
# whole external toolkit out of this venv via ML_PACKAGE_ROOT — a handful of standard
# libraries does not warrant that.
ml = [
    "catboost>=1.2.10",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
]

# No [build-system]: galactus is not a distributable package. The code under
# `runs/ai/marketing-comms/` is a case study read in place, not an importable library —
# declaring a build backend made `uv sync` fail looking for `src/galactus/`, which
# blocked installing the dev tools too.

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# .claude/ ships vendored skills and specs (see CLAUDE.md "Vendoring exception") —
# rendered payload whose canon lives upstream, not code this project lints.
# `ml/` is the same case: vendored from ai-project-template's ML payload. Fix lint
# findings upstream and re-vendor, rather than diverging the copy here.
extend-exclude = [".claude", "ml"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
# E501: ruff-format owns line length; RUF001-003: typographic unicode in prose;
# N803/N806: ML naming conventions (X, y, X_train)
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.ruff.lint.isort]
# `package = false` (see pytest config below) means neither package is installed
# into the venv, so ruff cannot infer them from the environment and sorts both as
# third-party — which merges the local import block into the vendor block and
# reports the correctly-ordered source as I001. Declaring them here fixes the
# classification rather than reordering imports to satisfy a wrong one.
# The marketing-comms modules are flat under its `src/`, not under a `galactus`
# package — an abandoned package move left `src/galactus/` as empty directories
# and the tests importing through them until 2026-08-15.
# The lending run's modules (frame, splits, summary, guards, synthetic, run_record)
# are flat under `runs/ml/lending/src/` the same way — tests import them as
# top-level names via a conftest sys.path insert.
known-first-party = [
    "api",
    "config",
    "frame",
    "generate",
    "guardrails",
    "guards",
    "ingest",
    "layout",
    "model",
    "models",
    "observability",
    "review",
    "run_record",
    "splits",
    "store",
    "summary",
    "synthetic",
]

[tool.pytest.ini_options]
# Every test directory under `runs/` is listed explicitly. An omission does not
# fail — it collects zero tests from that poc, which is indistinguishable from
# that poc passing. `runs/ml/fraud/tests` was missing until 2026-08-15, so its
# 35 tests had never run under a bare `uv run pytest`.
testpaths = [
    "runs/ai/marketing-comms/tests",
    "review/tests",
    "runs/ml/customer segmentation/tests",
    "runs/ml/fraud/tests",
    "runs/ml/lending/tests",
    "experiments/tests",
]
asyncio_mode = "auto"
# `package = false` means nothing installs `galactus` into the venv, so the import root
# has to be declared here. `runs/ai/marketing-comms/` is on the path too: `evals/` is a
# script directory imported as `evals.run` by the case study's `tests/test_evals.py`.
pythonpath = ["runs/ai/marketing-comms/src", "runs/ai/marketing-comms"]
