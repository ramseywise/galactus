[project]
name = "llm-kit"
version = "0.1.0"
description = "Minimal Anthropic client helpers for a timeboxed build"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["llm_kit.py"]
