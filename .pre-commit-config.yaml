# .claude/ is skills, specs and hook scripts — prose and shell, not code this project lints.
# template/ is copier payload: its Python only parses once rendered, so ruff and
# check-ast skip it here and `make lint-render` lints it after rendering instead.
exclude: ^\.claude/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10000"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
        exclude: ^template/
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: ^template/
      - id: ruff-format
        exclude: ^template/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        name: detect secrets (gitleaks)

  - repo: local
    hooks:
      - id: no-dotenv-staged
        name: .env not staged
        language: fail
        entry: ".env file must not be committed — use .env.example for templates"
        files: ^\.env$
