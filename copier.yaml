_min_copier_version: "9.3.0"
_subdirectory: template
_external_data:
  # Path is RELATIVE TO dst_path (copier joins it internally — do not prefix
  # _copier_conf.dst_path here, that double-joins and the file is never found).
  # Rendered, then loaded as a Jinja namespace (`_external_data.design.<path>`)
  # before question defaults compute. Empty dict on fresh genesis (no
  # design.yaml yet) or on any repo that predates this layer — every default:
  # expression below guards with
  # `_external_data.design is defined and _external_data.design and
  # _external_data.design.stages.<stage> == 'complete'` before reading it,
  # falling back to the existing A3-derived expression otherwise. See
  # .claude/docs/plans/2026-07-18-template-full-mirror-redesign.md Q5/Q5a for
  # the full mechanism (design.yaml is a 3rd, upstream flag layer; stage-gating
  # selects which branch of a when:false flag's default wins, not whether a
  # question is asked).
  design: "design.yaml"
_message_before_copy: >+
  AI-Eng Claude Template

  The interview is deliberately short (~11–14 questions). Phase 1 scopes the
  project — what you're building, who uses it, language(s), external systems,
  deployment — and, for agent-shaped projects, what the AI system itself looks
  like (tools, memory, human approval). Phase 4 covers team conventions
  (data sensitivity, ticket prefix, notifications). That's it — the
  architecture choices that used to be Phase 2/3 (chat-agent framework, vector
  store, TS agent loop, frontend/backend topology, MCP server, optional
  integrations, eval metrics) are NOT asked at genesis: project_type derives
  the one shape example, and each of those components is a mid-project
  capability you add later with `copier update -d include_<x>=true` (the
  /add-capability path). Everything inferred — directory names, eval layout,
  Python version, AWS region, and every deferred capability — is still
  overridable non-interactively with -d (e.g. -d primary_chat_agent=both,
  -d include_mcp_server=true, -d ai_source_root=lib).

  Picking "Layer onto an existing repo" as the project type is layering-only
  mode — safe to run into an existing repo, only adding .claude/
  mcp_servers and touching nothing else (equivalent to the old
  scaffold_full_project=false). All other project types scaffold a full
  project. The scaffold is minimal by default: one chat-agent example where
  the shape calls for it (lg_agent), and no MCP server or rag_agent unless
  the project IS one (mcp_server / rag shapes) or you ask for them — every
  component stays a `copier update -d include_<x>=true` away after genesis.

_message_after_copy: >+
  Done. Next steps:
  - Review CLAUDE.md and fill in the "Hard Rules" placeholder section.
  - Review DESIGN.md — the scoping answers you just gave are seeded there; finish the blank sections before sprint 1.
  - LIFECYCLE.md tracks phase + gates (Discovery → Delivery → Deployment) — run /gate-check once discovery artifacts exist; it's the file DSSG's project-mgmt-ai reads for status updates.
  - DEPLOYMENT.md is the Phase-3 runbook (staged rollout, rollback, monitoring) — fill it at the G2 gate; /deploy-check pre-flights launch readiness.
  - Run `chmod +x .claude/hooks/*.sh` if hooks aren't executable.
  - If scaffold_full_project: run `make setup` (uv sync + .env from example){% if primary_chat_agent in ["lg_agent", "both"] %}, then `make {{ lg_agent_dir | replace('_', '-') }}-up` to try the example agent{% elif primary_chat_agent == "adk_agent" %}, then `make {{ adk_agent_dir | replace('_', '-') }}-up` to try the example agent{% elif include_rag_agent %}, then `make rag-up` to try the example agent{% endif %}.
  {%- if scaffold_full_project and primary_backend_language in ["typescript", "both"] and frontend_backend_topology != "split_service" %}
  - TS backend service scaffolded at {{ ts_project_root }}/ — run `make ts-install` then `make ts-dev`.
  {%- endif %}
  {%- if has_typescript and ts_agent_framework == "vercel_ai_sdk" %}
  - Vercel AI SDK agent scaffolded at {{ ts_project_root }}/{{ ts_source_root }}/agents/{{ ts_agent_dir }}/ — set ANTHROPIC_API_KEY, then `make ts-dev` and POST to /agent/chat to try it.
  {%- endif %}
  {%- if scaffold_full_project and frontend_backend_topology == "split_service" %}
  - split_service scaffolded: Next.js frontend at {{ ts_project_root }}/ (`make ts-install` then `make ts-dev`) + FastAPI backend with Supabase-JWT auth ({{ py_project_root }}/{{ ai_source_root }}/middleware/auth.py). Create a Supabase project, fill in SUPABASE_URL/SUPABASE_ANON_KEY/SUPABASE_JWT_SECRET (backend) and NEXT_PUBLIC_SUPABASE_URL/NEXT_PUBLIC_SUPABASE_ANON_KEY (frontend) before first deploy — Vercel for the frontend, Railway for the backend (see railway.toml/vercel.json).
  {%- endif %}
  {%- if include_mcp_server %}
  - MCP server: `cd mcp_servers/{{ mcp_server_slug }} && {% if mcp_server_language == "typescript" %}npm install{% else %}uv sync{% endif %}`.
  {%- endif %}
  {%- if include_dev_companion %}
  - `.claude/docs/companion/collaboration.md` starts blank — fill it in by hand as real sessions teach you something durable.
  {%- endif %}

_message_after_update: >+
  Layout note: use_flat_layout defaults to false (nested, backend/src).
  Projects that recorded use_flat_layout: true will keep their flat layout;
  projects without the key get backend/.  To switch, re-run with
  -d use_flat_layout=true (flat) or -d use_flat_layout=false (nested).

_exclude:
  - __pycache__
  - "*.py[cod]"
  - .venv
  - .pytest_cache
  - .ruff_cache
  - .DS_Store
  - .git
  - copier.yaml

# ─── Phase 1 — Project scoping ────────────────────────────────────────────
# These questions determine the scaffold. Later phases either derive their
# defaults from these answers or are only asked when relevant. Hidden
# (when: false) questions are still computed and still overridable with -d —
# that's how CI and /new drive them non-interactively.

project_name:
  type: str
  help: What is your project name?
  placeholder: "{{project_name_input}}"
  default: "{{project_name_input}}"

project_slug:
  type: str
  help: Is this project slug ok? (used for folder/package naming)
  placeholder: my-project
  default: "{{ project_name.lower().replace(' ', '-') }}"
  when: false

project_description:
  type: str
  help: One-sentence description of the project
  default: "TODO: describe this project"

project_type:
  type: str
  help: >-
    What are you building? This drives which questions follow and what gets
    scaffolded — implementation details (vector store, eval harness, MCP
    language, ...) are inferred from it and only surfaced when they matter.
  choices:
    "AI chat application": chat_app
    "Autonomous agent": agent
    "Workflow automation": workflow
    "RAG / document Q&A": rag
    "MCP server": mcp_server
    "AI backend / API service": ai_backend
    "Evaluation suite": eval_suite
    "ML model (tabular / classical ML)": ml_model
    "Research prototype": prototype
    "Layer onto an existing repo (tooling only)": existing_repo
  default: chat_app

# Derived: the old top-level toggle, now inferred from project_type.
# existing_repo = layering-only mode — safe to run into an existing repo, only
# adds .claude/ and mcp_servers/. Overridable with -d scaffold_full_project=…
# (how CI's layering-only job drives it without picking a project_type).
scaffold_full_project:
  type: bool
  default: "{{ project_type != 'existing_repo' }}"
  when: false

# The one canonical "is this an agent-shaped project?" predicate — referenced by
# agent_tools/agent_memory/human_approval's when: and DESIGN.md.jinja's Key
# Decisions block, which must all stay in lockstep. Edit the list here only.
is_agent_shaped:
  type: bool
  default: "{{ scaffold_full_project and project_type in ['chat_app', 'agent', 'workflow', 'rag', 'ai_backend'] }}"
  when: false

# The ML twin of is_agent_shaped, and the reason it exists as its own predicate
# rather than as `not is_agent_shaped`: those two are NOT complements. Several
# shapes (eval_suite, mcp_server, prototype) are neither agent-shaped nor
# ml-shaped, and each still ships the agentic scaffold. Only ml_model selects
# an ML-shaped project — a project whose payload is {{ ml_source_root }}/ +
# nbks/ + tests/unit/ml and which renders NO agents/, evals/, llm_kit/, core/,
# or agentic lifecycle docs.
#
# This is the flag the gate-7 walkthrough asked for. Before it, `include_ml=true`
# layered ML *on top of* a full agentic scaffold — there was no way to render an
# ML project, only an agentic project that also had ml/. include_ml stays the
# "add the ML toolkit to whatever this project is" capability toggle; this is
# the "this project IS an ML project" shape predicate. Referenced by
# include_ml/has_corpus_pipeline/include_llm_kit/the doc gates and the _tasks
# cleanups — edit the shape list here only.
is_ml_shaped:
  type: bool
  default: "{{ scaffold_full_project and project_type == 'ml_model' }}"
  when: false

primary_users:
  type: str
  help: >-
    Who uses it? Seeds the data-sensitivity default (customer- or
    public-facing implies restricted) and DESIGN.md's actor table.
  choices:
    "Internal team": internal
    "Customers": customers
    "Developers": developers
    "Public API": public_api
  default: internal

primary_backend_language:
  type: str
  help: >-
    Implementation language(s). python ships the working example agents.
    typescript/both additionally scaffold a real Node/TS backend service (not
    just frontend hooks) with its own lint/typecheck/test tooling.
  choices:
    python: "python"
    typescript: "typescript"
    both: "both"
  default: >-
    {{ (('both' if (_external_data.design.backends.python.enabled and
    _external_data.design.backends.typescript.enabled) else
    ('typescript' if _external_data.design.backends.typescript.enabled else 'python')))
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else 'python' }}
  # Q5 row 4 (stage-gated on discovery): seed reflects which backends are
  # enabled in design.yaml once discovery is complete — the question stays
  # askable/​overridable either way (this only changes its seed, same as
  # every other Layer-A default). Else = the original literal 'python' default.
  when: false

# Derived from primary_backend_language. Override with -d has_typescript=true
# for a frontend-only TS project layered onto an existing repo (adds the TS
# quality/typecheck hooks without scaffolding a backend).
has_typescript:
  type: bool
  # Gated on scaffold_full_project: a layering-only render must not ship the
  # ts_*.sh hooks, which assume a scaffolded TS project (package.json/tsconfig
  # at ts_project_root) that layering mode never creates. A frontend-only
  # layered TS repo can still opt in with -d has_typescript=true.
  default: "{{ primary_backend_language in ['typescript', 'both'] if scaffold_full_project else false }}"
  when: false

external_systems:
  type: str
  multiselect: true
  help: >-
    Which external systems will this project interact with? Seeds later
    defaults (Calendar → Google Calendar client, Web → web research,
    Slack/GitHub/Email/Workspace → Composio, Database → pgvector) — every
    seeded choice resurfaces for confirmation later, nothing is silently
    locked in.
  choices:
    "Slack": slack
    "GitHub": github
    "Google Workspace": google_workspace
    "Calendar": calendar
    "Email": email
    "Database": database
    "Web": web
  default: []

deployment_target:
  type: str
  help: >-
    Expected deployment. Recorded in DESIGN.md's key decisions; Dockerfiles
    (infrastructure/containers/) ship with every full scaffold, and the
    terraform/ skeleton ships only when cloud == aws (the skeleton is AWS-only:
    ECS Fargate + ALB; selecting gcp would render the wrong provider's IaC).
    docker/cloud additionally scaffold .github/workflows/cd.yml
    (build-and-push to GHCR) when the lg_agent image exists to build —
    local/serverless get no CD workflow (serverless deploys via the
    platform's own git integration).
  choices:
    "Local only": local
    "Docker": docker
    "Cloud (long-running service)": cloud
    "Serverless (Vercel / Lambda)": serverless
  default: >-
    {{ _external_data.design.deployment_target
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else 'local' }}
  # Q5 row 9 (stage-gated on discovery): direct copy of design.deployment_target
  # once discovery is complete; else the original literal 'local' default. Stays
  # askable — this only changes the seed shown/used, same as primary_backend_language.
  when: false

# Q5 row 8 (new flag): which cloud, drives the RAG-per-cloud matrix (Q4:
# bedrock_kb needs aws, vertex_rag needs gcp) and terraform provider selection
# (providers.aws.tf / providers.gcp.tf, gated on this flag — see Q4 execution
# note). Stage-gated on discovery; else 'none' (no legacy expression — cloud
# selection is new in this redesign, deployment_target alone didn't carry it).
cloud:
  type: str
  choices:
    none: "none"
    aws: "aws"
    gcp: "gcp"
  default: >-
    {{ _external_data.design.cloud
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else 'none' }}
  when: false

# ─── Phase 1b — the AI system itself ──────────────────────────────────────
# Only asked for agent-shaped projects. These shape DESIGN.md's key-decisions
# table and seed architecture defaults (MCP server, postgres checkpointer) —
# they matter more than any individual tool toggle.

agent_tools:
  type: str
  multiselect: true
  help: >-
    Will the agent use tools? Recorded in DESIGN.md; selecting "MCP" (a
    declared MCP host consumer) seeds the MCP-server default. Nothing is
    pre-selected beyond what your external-systems answer implies — REST is
    the standard service boundary, MCP an adapter over it.
  choices:
    "Web search": search
    "Filesystem": filesystem
    "GitHub": github
    "Database": database
    "MCP (expose/consume tools)": mcp
    "Custom (project-specific)": custom
  default: "{{ (['github'] if 'github' in external_systems else []) + (['database'] if 'database' in external_systems else []) }}"
  when: false

agent_memory:
  type: str
  help: >-
    Will the agent store memory? conversation = per-thread history (LangGraph
    checkpointer, the scaffold's default). long_term = durable cross-session
    memory — seeds the postgres checkpointer dependency so persistence has
    somewhere real to live. Recorded in DESIGN.md.
  choices:
    "No memory (stateless calls)": none
    "Conversation history": conversation
    "Long-term / cross-session": long_term
  default: conversation
  when: false

human_approval:
  type: str
  help: >-
    Does the agent need human approval before acting? Recorded in DESIGN.md's
    key decisions — it constrains every tool that writes to an external
    system, so decide it now, not after the first irreversible write.
  choices:
    "No — fully autonomous": none
    "Sometimes — for irreversible/external writes": sometimes
    "Always — human confirms every action": always
  default: sometimes
  when: "{{ is_agent_shaped }}"

# Inferred directory layout — computed here (before Phase 2) because later
# question help-strings interpolate it; copier renders each question with only
# the answers collected so far. use_flat_layout is asked (recorded in
# .copier-answers.yml) and py_project_root derives from it; ai_source_root and
# ml_source_root are never asked — override with -d ai_source_root=… /
# -d ml_source_root=… if yours differs.
#
# Two-root scaffold (2026-07-19): the staging tree under _scaffold/ now mirrors
# the destination layout instead of staying flat. _scaffold/ itself is the
# UNIVERSAL shell (build/deploy/CI/config — pyproject, Makefile, .github,
# .vscode, configs, infrastructure); one level down sits a per-language project
# root holding that language's backend:
#
#   _scaffold/{{ py_project_root }}/   ← Python backend (promotes atomically)
#     {{ ai_source_root }}/  agents, integrations, middleware,
#                            observability, security
#     {{ ml_source_root }}/  classical ML/stats toolkit
#     {{ eval_root }}/       eval suite — a SIBLING of both source roots, not
#                            nested: evals import ACROSS roots (run.py pulls
#                            core.pipelines.corpus.models alongside
#                            evals.graders.*), so they are a consumer of every
#                            root rather than a member of one.
#     core/ data/ nbks/ tests/
#   _scaffold/{{ ts_project_root }}/   ← TS backend (promotes atomically)
#     {{ ts_source_root }}/  agent/, app.ts, index.ts
#
# These defaults reproduce the previous single `source_root: backend/src`
# exactly — py_project_root + ai_source_root == backend/src — so rendered
# destination paths are unchanged; only the staging layout moved.
#
# Flat layout (AIT-33): a python-only backend with no frontend tree has nothing
# to disambiguate, so py_project_root collapses to '.' and the backend lands at
# ./src instead of backend/src. ml_source_root stays 'ml' — under flat layout ML
# is scaffolded as an optional sibling backend to the agentic src/, at ./ml/.
# The frontend condition is INLINED from _external_data (not `include_frontend`)
# because that question is declared later in this file — copier renders each
# default with only the answers collected so far, so referencing it here would
# be undefined.
#
# use_flat_layout (AIT-40): the layout choice is surfaced as a recorded answer
# so it survives `copier update` without re-passing -d.  It is only asked for
# python-only projects with no frontend (same guard as py_project_root's old
# default condition).  The default is false so that pre-4eac907 projects
# (which have no use_flat_layout in their .copier-answers.yml) keep their
# existing backend/ tree intact on the next `copier update`.  New python-only
# renders wanting the flat layout must pass -d use_flat_layout=true (or answer
# the question interactively).
#
# Note: _copier_operation is NOT available in default: expressions in copier
# 9.17.0 — it is only injected into the task-execution context, not the
# question-rendering context (_render_context()).  Verified empirically:
# `{{ _copier_operation == 'copy' }}` evaluates to False for both copy and
# update, so it cannot be used to give new renders a different default.
use_flat_layout:
  type: bool
  help: >-
    Put the Python backend at the repo root (flat layout, src/ at ./src) instead
    of under backend/ (nested layout, backend/src)?  The default is nested.
    Answer yes only if you want src/ directly at the repo root.
  default: false
  when: >-
    {{ primary_backend_language == 'python' and not
    (_external_data.design.web.enabled
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else false) }}

py_project_root:
  type: str
  default: "{{ '.' if use_flat_layout else 'backend' }}"
  when: false

ai_source_root:
  type: str
  default: src
  when: false

ml_source_root:
  type: str
  default: ml
  when: false

run_registry_root:
  type: str
  default: experiments
  when: false

# ─── Phase 2 — Architecture (A3: derived from Phase 1, -d-only, never asked) ─
# These were interview questions; A3 (F4) made them `when: false` — the shape
# example is derived from project_type and each component is a deferred
# capability added post-genesis via `copier update -d <name>=…`
# (the /add-capability path). Defaults + validators still apply; drive them
# non-interactively with -d.

primary_chat_agent:
  type: str
  help: >-
    Which prebuilt chat-agent implementation(s) do you want? This picks the
    framework(s) of the user-facing chat agent — the agent itself is named by
    the next question (agent_slug), not after the framework. A new project
    needs one working example (lg_agent by default); the other framework is a
    `copier update -d primary_chat_agent=…` away. "none" means no prebuilt
    chat agent — build your own.
  choices:
    lg_agent: "lg_agent"
    adk_agent: "adk_agent"
    both: "both"
    none: "none"
  default: >-
    {{ ('lg_agent' if _external_data.design.backends.python.framework == 'langgraph' else
    ('adk_agent' if _external_data.design.backends.python.framework == 'adk' else 'none'))
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete' and
    _external_data.design.backends.python.enabled) else
    ('lg_agent' if project_type in ['chat_app', 'agent', 'workflow', 'prototype'] else 'none') }}
  # A3: no longer asked at genesis — project_type picks the one shape example
  # (chat shapes → lg_agent; everything else → none). A second framework is a
  # tier-3 capability added later via `copier update -d primary_chat_agent=…`
  # (the /add-capability path). Still computed + overridable with -d.
  # Q5 row 1 (design.yaml layer, stage-gated on discovery): once
  # design.stages.discovery == 'complete', backends.python.framework wins
  # (langgraph -> lg_agent, adk -> adk_agent, python disabled -> none); else
  # the A3-derived project_type expression above is the fallback. Flag stays
  # when: false — stage-gating picks the default: branch, not askability.
  when: false

agent_slug:
  type: str
  help: >-
    Directory/package name for your chat agent under
    {{ py_project_root }}/{{ ai_source_root }}/agents/ — name it for what the agent DOES
    (intake_triage, helpdesk, grants_qa), not the framework it's built on.
    Makefile targets follow it (<slug>-up/-down/-chat). With
    primary_chat_agent=both, the LangGraph implementation gets this name and
    the ADK one gets <slug>_adk.
  placeholder: assistant
  default: assistant
  validator: >-
    {% if not (agent_slug | regex_search('^[a-z][a-z0-9_]*$')) %}agent_slug
    must be a lowercase Python identifier (letters/digits/underscores, letter
    first){% endif %}{% if agent_slug in ['rag_agent', 'lg_agent', 'adk_agent',
    'agents', 'core', 'tests'] %} agent_slug '{{ agent_slug }}' is
    reserved{% endif %}
  # A3: no longer asked at genesis — the single chat example is named `assistant`
  # by default; rename it with -d agent_slug=<name> (validator still enforced).
  when: false

# Derived directory names the templates and _tasks actually consume. When a
# framework isn't the chosen one its tree keeps the framework name in staging
# (it's removed by _tasks before the big mv, so the name never reaches the
# rendered project). agent_slug values colliding with these staging names are
# rejected by the validator above.
lg_agent_dir:
  type: str
  default: "{{ agent_slug if primary_chat_agent in ['lg_agent', 'both'] else 'lg_agent' }}"
  when: false

adk_agent_dir:
  type: str
  default: "{{ (agent_slug ~ '_adk') if primary_chat_agent == 'both' else (agent_slug if primary_chat_agent == 'adk_agent' else 'adk_agent') }}"
  when: false

include_rag_agent:
  type: bool
  help: >-
    Ship the prebuilt rag_agent retrieval backend (LangGraph + vector store)?
    Default on only for the rag project shape — it's that shape's working
    end-to-end example, not shared infrastructure. Other shapes opt in here
    (or later via `copier update -d include_rag_agent=true`). The MCP
    retrieval tool, when scaffolded, calls RAG_AGENT_URL either way — point
    it at any compatible /api/v1/retrieval endpoint.
  default: >-
    {{ ('rag' in _external_data.design.backends.python.capabilities)
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    (project_type == 'rag') }}
  # A3: no longer asked at genesis — on for the rag shape (its example), off
  # elsewhere. A tier-3 capability otherwise: add later with
  # `copier update -d include_rag_agent=true` (/add-rag).
  # Q5 row 3 (stage-gated on discovery): 'rag' in
  # design.backends.python.capabilities wins once discovery is complete; else
  # the A3-derived project_type == 'rag' expression is the fallback.
  when: false

# Derived: does this render ship the corpus data pipeline
# (core/pipelines/corpus/ — markdown → JSONL → DuckDB FTS index) and the
# retrieval golden-QA eval that grades against it? True when RAG is on
# (rag_agent present — embedding retrieval over the preprocessed corpus).
# The LangGraph chat agent is corpus-free by default; its retrieve node and
# BM25 wiring are the additive corpus demo layer, rendered only when this
# flag is true. core/ itself is the general ETL home and
# always ships in a full scaffold; only the corpus SUBpackage + its golden-QA
# eval, tests, fixtures, and Makefile targets are gated here — a non-retrieval
# shape (mcp_server / eval_suite / ai_backend / adk-only / none) gets an empty
# core/ ETL layer with no corpus pipeline welded in. Override with
# -d has_corpus_pipeline=… (independent of scaffold_full_project — false in
# layering mode, which ships no src pipeline at all).
has_corpus_pipeline:
  type: bool
  default: >-
    {{ (scaffold_full_project and 'rag' in _external_data.design.backends.python.capabilities
    and _external_data.design.rag.corpus_pipeline == 'markdown_jsonl')
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    (scaffold_full_project and include_rag_agent) }}
  # AIT-32: the A3-derived else branch dropped its `or lg_agent` clause —
  # lg_agent no longer implies the corpus demo. design.yaml branch additionally requires
  # rag.corpus_pipeline == 'markdown_jsonl' (Q4): only that rag_impl ships the
  # markdown->JSONL->DuckDB pipeline; bedrock_kb/vertex_rag/ts_vectorstore don't.
  when: false

vector_backend:
  type: str
  help: >-
    rag_agent's vector store backend. duckdb is a durable single file, no
    external service. memory is in-process (zero setup, optional JSON snapshot
    for persistence across restarts) — good for local dev/CI. opensearch is
    for production scale (external cluster, HNSW kNN) — requires the optional
    opensearch-py dependency and a reachable cluster. postgres uses pgvector —
    for Supabase or any managed Postgres, requires the optional
    psycopg/pgvector dependencies and a reachable database with the pgvector
    extension enabled.
  choices:
    duckdb: "duckdb"
    memory: "memory"
    opensearch: "opensearch"
    postgres: "postgres"
  default: >-
    {{ _external_data.design.rag.vector_store
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    ('postgres' if 'database' in external_systems else 'duckdb') }}
  # A3 (F4): a vector-backend upgrade is a mid-project capability, not a
  # genesis decision — default duckdb (or postgres when a database was named),
  # change later with -d vector_backend=… (/add-capability vector-backend).
  # Q5 row 7 (stage-gated on discovery): direct copy of design.rag.vector_store;
  # else the A3-derived external_systems-based expression.
  when: false

# Q5 row 7 (new flag): which RAG implementation the vectorstore factory
# selects — langgraph_vectorstore (current, vector_backend-driven),
# bedrock_kb (ADK+AWS managed KB), vertex_rag (ADK+GCP managed RAG Engine),
# ts_vectorstore (TS backend mirror). See the RAG-per-cloud matrix (plan Q4).
# Stage-gated on discovery; else langgraph_vectorstore (today's only impl).
rag_impl:
  type: str
  choices:
    langgraph_vectorstore: "langgraph_vectorstore"
    bedrock_kb: "bedrock_kb"
    vertex_rag: "vertex_rag"
    ts_vectorstore: "ts_vectorstore"
  default: >-
    {{ _external_data.design.rag.backend
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else 'langgraph_vectorstore' }}
  when: false

# Q5 row 7 (new flag): which corpus ingestion tree ships. Only markdown_jsonl
# ships the core/pipelines/corpus/ DuckDB FTS pipeline (has_corpus_pipeline);
# bedrock_ingest/vertex_datastore/ts_ingest ship managed-ingestion config
# instead (plan Q4 table). Stage-gated on discovery; else markdown_jsonl.
corpus_pipeline_kind:
  type: str
  choices:
    markdown_jsonl: "markdown_jsonl"
    bedrock_ingest: "bedrock_ingest"
    vertex_datastore: "vertex_datastore"
    ts_ingest: "ts_ingest"
  default: >-
    {{ _external_data.design.rag.corpus_pipeline
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else 'markdown_jsonl' }}
  when: false

# Q5 row 5 (new flag): backend-ts RAG mirror (Q4 tree D, ts_vectorstore).
# Gates backend-ts/src/rag/ cleanup. Stage-gated on discovery; else false (no
# legacy expression — the TS RAG mirror is new in this redesign).
include_ts_rag:
  type: bool
  default: >-
    {{ ('rag' in _external_data.design.backends.typescript.capabilities)
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else false }}
  when: false

# Derived: adds langgraph-checkpoint-postgres so the LangGraph checkpointer
# CAN be switched to postgres at runtime (LG_CHECKPOINTER=postgres /
# RAG_CHECKPOINTER=postgres, using POSTGRES_DSN). The runtime default stays
# "memory" either way — checkpointer construction happens eagerly at
# graph-compile time (unlike vector_backend, which is lazy per-call), so
# defaulting straight to postgres would make `make test`/import fail hard
# without a live database reachable. Seeded on when the agent declared
# long-term memory; independent of vector_backend
# (override with -d enable_postgres_checkpointer=…).
enable_postgres_checkpointer:
  type: bool
  default: "{{ agent_memory == 'long_term' }}"
  when: false

# Derived TS layout — 99% of projects answer src / <project_slug>; override
# with -d ts_source_root=… / -d ts_project_root=… if yours differs.
ts_source_root:
  type: str
  default: src
  when: false

ts_project_root:
  type: str
  default: "{{ project_slug }}"
  when: false

# The TS agent's own directory under {{ ts_source_root }}/agents/ — the TS twin
# of lg_agent_dir/adk_agent_dir. Before AIT-70 the TS agent lived in a singular
# `agent/` directory that also held tracing, guards and the LLM client; those
# moved out to observability/, guardrails/ and model/ (naming.md §1), leaving
# agents/<name>/ to hold only agent logic. Named for what the agent DOES, same
# convention as the Python agent dirs.
ts_agent_dir:
  type: str
  default: chat_agent
  when: false

# ts_backend_dest was deleted 2026-07-19 (two-root scaffold). It existed to
# resolve a collision that no longer occurs: under `both`, Python owned
# backend/ and TS had to fall back to its project-named root. Now each language
# stages under — and promotes to — its own project root side by side, so there
# is nothing to rename on promotion. The TS backend lands at
# {{ ts_project_root }} in every configuration.

# Orthogonal to primary_chat_agent — a TS project may or may not want an agent
# loop at all (some TS backends are plain API services). vercel_ai_sdk stages
# a real agent/ tree (streamText + tool() loop, Anthropic provider) at
# {{ ts_project_root }}/{{ ts_source_root }}/agent/, framework-agnostic (a
# plain Request->Response handler, wireable into Express today or a Next.js
# route handler in a Vercel-hosted project) — see
# .claude/skills/framework-selection.
ts_agent_framework:
  type: str
  help: >-
    TypeScript agent framework. none stages the plain TS backend service only,
    no LLM code. vercel_ai_sdk additionally stages a real tool-calling agent
    loop (Vercel AI SDK's streamText + tool()) — for projects deploying a
    TS-native assistant (e.g. a Vercel-hosted frontend's own API routes)
    rather than calling out to a separate Python agent service.
  choices:
    none: "none"
    vercel_ai_sdk: "vercel_ai_sdk"
  default: >-
    {{ (_external_data.design.backends.typescript.framework
    if _external_data.design.backends.typescript.enabled else 'none')
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    ('vercel_ai_sdk' if primary_backend_language == 'typescript' and project_type in ['chat_app', 'agent'] else 'none') }}
  # A3 (F4): topology/second-framework decision — derived from language + shape,
  # override with -d ts_agent_framework=vercel_ai_sdk (added later as a capability).
  # Q5 row 4 (stage-gated on discovery): design.backends.typescript.framework
  # wins once discovery is complete (only 'none'|'vercel_ai_sdk' choices exist
  # today so this is a direct passthrough); else the A3-derived expression.
  when: false

# Orthogonal to ts_agent_framework — that toggle is about whether the *agent
# loop* lives in TS (single-service, no separate Python backend needed).
# frontend_backend_topology is about *deployment shape*: does the TS side
# deploy as one thing, or as a genuinely separate service from the Python
# backend, each with its own host and its own auth boundary? split_service
# scaffolds FOIA-Fluent's actual production shape (dssg/projects/FOIA-Fluent)
# — a Next.js frontend + a separate FastAPI backend, sharing identity via
# Supabase Auth JWT rather than sharing a process. Mutually exclusive in
# practice with ts_agent_framework=vercel_ai_sdk (that path assumes the
# agent's own API routes ARE the backend); /new should flag the
# conflict rather than copier enforcing it structurally.
frontend_backend_topology:
  type: str
  help: >-
    How do frontend and backend deploy? single (default) is one deployable —
    frontend hooks only, or one Node/TS backend service per
    primary_backend_language. split_service scaffolds FOIA-Fluent's proven
    shape: a Next.js frontend (Vercel) + a separate FastAPI backend (Railway),
    talking over HTTPS, sharing identity via Supabase Auth JWT — an Edge
    middleware on the frontend and a FastAPI dependency on the backend
    ({{ py_project_root }}/{{ ai_source_root }}/middleware/auth.py) — with Postgres RLS for tenant
    isolation. Only offered when there's both a real TS component and a
    Python backend to connect.
  choices:
    single: "single"
    split_service: "split_service"
  default: >-
    {{ ('split_service' if (_external_data.design.web.enabled and
    _external_data.design.backends.python.enabled) else 'single')
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else 'single' }}
  # A3 (F4): split_service is a tier-3 deployment-shape capability, landed when
  # a real frontend ships — not a genesis question. Default single; opt in with
  # -d frontend_backend_topology=split_service (/add-capability split_service).
  # Q5 row 6 (stage-gated on discovery): split_service when both web.enabled
  # and backends.python.enabled are true in design.yaml; else 'single'.
  when: false

# Q5 row 6 (new flag): whether a frontend/ tree renders at all. Independent of
# frontend_backend_topology (which governs deploy SHAPE once a frontend
# exists) — this governs whether one exists. Stage-gated on discovery; else
# false (A3 has no frontend concept pre-design.yaml — frontend is entirely new
# in this redesign, so there is no legacy expression to fall back to).
include_frontend:
  type: bool
  help: >-
    Scaffold a frontend/ tree (Next.js)? Derived from design.yaml's web.enabled
    once discovery is complete; off otherwise — this template has no frontend
    scaffold prior to the full-mirror redesign.
  default: >-
    {{ _external_data.design.web.enabled
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else false }}
  when: false

# AIT-70: which frontend the frontend/ tree renders. Before this the tree was
# Next.js-only, which meant no SPA option existed at all — dssg/project-mgmt-ai
# (Vite + React 19 + Tailwind, a client-rendered console with no SSR need) had
# to be hand-built rather than scaffolded. The two are genuinely different
# shapes, not a preference: next brings SSR/RSC, file-system routing and its own
# server runtime; vite is a client bundle served statically, pairing with a
# separate api/ backend. Choose by whether the app needs server rendering.
frontend_bundler:
  type: str
  help: >-
    Frontend build tool. next scaffolds a Next.js app (SSR/RSC, file-system
    routing, Supabase SSR auth) — pick it when pages must render server-side or
    the frontend IS the backend (its own API routes). vite scaffolds a
    React 19 + Tailwind SPA (client-rendered, react-router, vitest) — pick it
    for a console/dashboard talking to a separate API, which is the
    project-mgmt-ai shape.
  choices:
    next: "next"
    vite: "vite"
  default: >-
    {{ _external_data.design.web.bundler
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete' and
    _external_data.design.web.bundler is defined) else 'next' }}
  # Default next preserves the pre-AIT-70 render for existing projects: a repo
  # that answered include_frontend=true before this flag existed gets exactly
  # what it had. Opt into the SPA with -d frontend_bundler=vite.
  when: false

# AIT-70: Supabase as the APPLICATION database — migrations, RLS policies and a
# pgSQL test harness — which is distinct from the two Supabase touchpoints that
# already existed: auth (@supabase/ssr in the frontend, JWT middleware in the
# split_service backend) and vector_backend=postgres (pgvector as a RAG store).
# Neither of those gives a project row-level tenant isolation or a migration
# history. project-mgmt-ai's 8 migrations (tenancy, telemetry, approval spine,
# delivery, documents) are the reusable pattern this scaffolds.
include_supabase_db:
  type: bool
  help: >-
    Scaffold supabase/ — a migrations tree with a tenancy + RLS starter, a
    pgSQL RLS test harness, and the Supabase CLI as a dev dependency? For
    projects where Postgres IS the application database and tenant isolation is
    enforced in the database rather than the application layer.
  default: >-
    {{ _external_data.design.data.supabase_db
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete' and
    _external_data.design.data is defined and
    _external_data.design.data.supabase_db is defined) else false }}
  when: false

# mcp_servers/ lives at template root, NOT inside _scaffold/ — deliberately. It
# is available in layering-only mode (project_type=existing_repo), same class as
# .claude/: something addable to an existing repo that does not
# require a full scaffold. Moving it into _scaffold/ would make layering mode
# render an empty directory (everything inside _scaffold/ is discarded in that
# mode). The `include_mcp_server` task below prunes the whole mcp_servers/ dir
# when the toggle is off — correct in both modes.
# Independent of scaffold_full_project — available in layering-only mode too.
include_mcp_server:
  type: bool
  help: >-
    Scaffold a parameterized MCP server for this project? Defaults on only
    when the project IS an MCP server, or when you explicitly listed MCP in
    agent_tools (a declared MCP host consumer). MCP servers here are thin
    adapters over the REST boundary, never the primary surface.
  # A3/§3c: no longer asked at genesis — on only when the project IS an MCP
  # server or you listed MCP in agent_tools (a declared host consumer). Add an
  # MCP adapter later with -d include_mcp_server=true (/add-capability mcp).
  default: "{{ project_type == 'mcp_server' or 'mcp' in agent_tools }}"
  when: false

mcp_server_name:
  type: str
  default: "{{ project_slug }}"
  when: false

# RETAINED DELIBERATELY (decided 2026-07-19) — do not delete as dead indirection.
# This is the single seed both py_mcp_server_slug and ts_mcp_server_slug read, so
# the two trees are guaranteed to agree on the survivor's path. Splitting it into
# two independent expressions is what produced the empty-mcp_servers/ bug the
# comment below records. It carries no user answer (never asked, never set by -d),
# so there is nothing a rename would preserve that project_slug can't reconstruct.
# Renaming it would also need a PRE-RENDER .copier-answers.yml rewrite: copier
# 9.17.0 strips unknown answers keys before building the Jinja context, so an
# `is defined` fallback reads False on update and silently loses the value.
mcp_server_slug:
  type: str
  default: "{{ project_slug }}"
  when: false

# Directory names for the two disjoint MCP trees. copier renders every path
# unconditionally, so the python and typescript trees must be distinct paths in
# template/ or they'd collide. The CHOSEN language renders at the real slug; the
# other gets an `__unchosen_*` suffix that the mcp prune task in _tasks deletes.
# (Naive aliasing — both defaulting to mcp_server_slug — makes the two trees
# indistinguishable, so the prune deletes the chosen one too. Verified
# 2026-07-19: that bug rendered an mcp_servers/ containing only README.md.)
# Renaming either var without renaming its template/mcp_servers/ dir renders an
# EMPTY path segment, silently.
mcp_server_language:
  type: str
  help: >-
    MCP server implementation language. python (FastMCP) or typescript (the
    official MCP TypeScript SDK — see
    .claude/skills/mcp-builder/reference/node_mcp_server.md). Independent of
    primary_backend_language — a Python backend can have a TS MCP server or
    vice versa; the default just follows your language answer.
  choices:
    python: "python"
    typescript: "typescript"
  default: "{{ 'typescript' if primary_backend_language == 'typescript' else 'python' }}"
  # A3: derived from primary_backend_language now that include_mcp_server is
  # -d-only; override with -d mcp_server_language=typescript.
  #
  # Layout note: the two languages are disjoint file trees, not one tree with a
  # Jinja switch, so they can't collapse into a single dir in template/. They
  # render side by side as mcp_servers/{{ py_mcp_server_slug }} (FastMCP) and
  # mcp_servers/{{ ts_mcp_server_slug }} (MCP TS SDK); _tasks then deletes the
  # unchosen one. Both slugs default to mcp_server_slug, so the survivor is
  # already at its final path. The language *choice* is made in _tasks, the one
  # layer that can delete whole trees.
  when: false

# MUST stay declared AFTER mcp_server_language — copier evaluates defaults in
# declaration order, so referencing it from above yields an empty string and
# NEITHER branch matches, suffixing both trees and pruning both away.
py_mcp_server_slug:
  type: str
  default: "{{ mcp_server_slug }}{{ '' if mcp_server_language == 'python' else '__unchosen_py' }}"
  when: false

ts_mcp_server_slug:
  type: str
  default: "{{ mcp_server_slug }}{{ '' if mcp_server_language == 'typescript' else '__unchosen_ts' }}"
  when: false

# ─── Phase 3 — Optional features (A3: derived, -d-only, never asked) ──────
# Was a genesis multiselect; A3 (F4) made optional_features + eval_metrics
# `when: false`. The shape-derived default is applied silently at genesis; add
# integrations/metrics later with -d (/add-integration, /add-eval-metric).

optional_features:
  type: str
  multiselect: true
  help: >-
    Optional add-ons. Defaults are seeded from your Phase-1 answers — the dev
    companion is on by default; integrations implied by your external-systems
    answer are pre-selected; everything else is off.
    (Calendar isn't listed here — selecting Calendar in external systems
    already scaffolds the Google Calendar client.)
  choices:
    "dev companion — living how-we-work doc": dev_companion
    "promptfoo — config-driven HTTP eval harness alongside the Python evals": promptfoo
    "ragas — LLM-judge eval grader (KNOWN ISSUE: ragas 0.4.3 import bug upstream, degrades gracefully, no real scores until fixed)": ragas
    "web research — GPT-Researcher reports (KNOWN ISSUE: needs Python <=3.13, own API keys)": web_research
    "meeting intelligence — transcript -> action items/decisions via one LLM call": meeting_intelligence
    "marketing clients — Eventbrite/LinkedIn/Canva httpx clients": marketing
    "n8n webhook — HMAC-verified inbound receiver (POST /webhooks/n8n)": n8n_webhook
    "composio — third-party app actions (Gmail/Slack/GitHub, hundreds more)": composio
    "ml — classical ML/stats toolkit (regression, time-series, A/B, clustering)": ml
  default: "['dev_companion'{% if 'web' in external_systems %}, 'web_research'{% endif %}{% if 'slack' in external_systems or 'github' in external_systems or 'email' in external_systems or 'google_workspace' in external_systems %}, 'composio'{% endif %}{% if project_type == 'workflow' %}, 'n8n_webhook'{% endif %}{% if project_type == 'eval_suite' %}, 'promptfoo'{% endif %}]"
  # A3 (F4): optional integrations are mid-project capabilities, not a genesis
  # menu — the shape-derived default (dev_companion, plus integrations
  # implied by external_systems/shape) is applied silently; add more later with
  # -d optional_features=[…] or the /add-integration path. Still overridable.
  when: false

# Does this project produce model interactions worth grading? The interaction
# evals (escalation/friction/intent/language) grade a *conversational turn* —
# they need a chat agent to have produced one. `is_agent_shaped` is the wrong
# gate for that: it keys off project_type, which is the project's SHAPE, not
# whether a chat agent was actually scaffolded. The two diverge in both
# directions, and step 7 exists because both divergences shipped:
#   - primary_chat_agent=none on an agent-shaped type (chat_app etc.) rendered
#     escalation+friction graders, a metrics_registry importing them, and
#     targets.yaml keys — all grading an agent the project does not contain.
#   - an ml-shaped project (project_type=prototype + ml) is not agent-shaped,
#     so it correctly got none; that half was already right and must stay right.
# Keyed on primary_chat_agent for the same reason has_corpus_pipeline is: the
# concrete capability, not the shape label. `both` counts (two agents, still
# gradeable turns); `none` does not.
#
# adk_agent counts even though the shipped judges were written against the
# LangGraph example — the graders read EvalInteraction (framework-agnostic
# recorded turns), not a framework object, so an ADK project grades its own
# interactions through the same registry.
has_gradeable_interactions:
  type: bool
  default: >-
    {{ (scaffold_full_project and _external_data.design.backends.python.enabled
    and _external_data.design.backends.python.framework in ['langgraph', 'adk'])
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    (scaffold_full_project and is_agent_shaped
    and primary_chat_agent in ['lg_agent', 'adk_agent', 'both']) }}
  # Mirrors has_corpus_pipeline's two-branch shape (Q5): design.yaml once
  # discovery is complete, else the A3-derived answer expression. `and
  # is_agent_shaped` is kept in the else branch so a NON-agent shape that
  # nonetheless carries a chat-agent answer (primary_chat_agent defaults to
  # lg_agent for `prototype`, which is not agent-shaped) does not acquire
  # interaction evals — that half of the coupling was already correct.
  when: false

eval_metrics:
  type: str
  multiselect: true
  help: >-
    Interaction-eval metrics to scaffold in {{ eval_root }}/ — each ships a
    matched heuristic grader + LLM judge + aggregation + report section, wired
    through graders/metrics_registry.py, with sampling/redaction/calibration
    pipelines alongside. Retrieval isn't listed: its golden-QA eval ships with
    every full scaffold regardless. Projects with a prebuilt chat agent
    pre-select escalation + friction.
  choices:
    "escalation — did the assistant hand off to a human when it should?": escalation
    "friction — hedging/vagueness/UX friction in responses": friction
    "intent — routing/intent classification correctness": intent
    "language — response language matches the user's": language
  default: "[{% if has_gradeable_interactions %}'escalation', 'friction'{% endif %}]"
  # A3 (F4): interaction-eval metrics are added as they become relevant, not at
  # genesis — projects with a chat agent seed escalation + friction; add others
  # later with -d eval_metrics=[…] (/add-eval-metric). Still overridable.
  # Step 7: the seed gate moved from is_agent_shaped to
  # has_gradeable_interactions — see that variable's comment.
  when: false

# Derived feature toggles — the _tasks block and templates consume these
# names; the multiselect above (plus external_systems for calendar) is the
# single user-facing surface. Each remains overridable with -d, which is how
# CI exercises individual axes (e.g. -d include_ml=true).

# Both gated on scaffold_full_project: optional_features is skipped in
# layering-only mode but still computes its full default list, which would
# otherwise flip these on in an existing repo that never asked for them.
include_dev_companion:
  type: bool
  default: "{{ scaffold_full_project and 'dev_companion' in optional_features }}"
  when: false

include_promptfoo:
  type: bool
  default: "{{ 'promptfoo' in optional_features }}"
  when: false

include_ragas_grader:
  type: bool
  default: "{{ 'ragas' in optional_features }}"
  when: false

include_web_research:
  type: bool
  default: "{{ 'web_research' in optional_features }}"
  when: false

include_meeting_intelligence:
  type: bool
  default: "{{ 'meeting_intelligence' in optional_features }}"
  when: false

include_marketing_integrations:
  type: bool
  default: "{{ 'marketing' in optional_features }}"
  when: false

include_n8n_webhook:
  type: bool
  default: "{{ 'n8n_webhook' in optional_features }}"
  when: false

include_composio:
  type: bool
  default: "{{ 'composio' in optional_features }}"
  when: false

include_ml:
  type: bool
  default: >-
    {{ ('ml' in _external_data.design.backends.python.capabilities)
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    (is_ml_shaped or 'ml' in optional_features) }}
  # Q5 row 2: repoints include_ml's OWN default directly, bypassing the
  # optional_features multiselect (design.yaml never reconstructs that list).
  # Stage-gated on discovery; else = existing A3-derived 'ml' in
  # optional_features expression, plus is_ml_shaped: the ml_model shape ships
  # the ML toolkit as its payload, not as an opt-in add-on. Kept as an OR (not
  # a replacement) so a non-ML shape can still add ml/ via optional_features,
  # which is the pre-existing /add-capability path.
  when: false

# llm_kit/ is a standalone LLM-calling starter kit at the repo root. It had no
# gate at all before ml_model existed — it rendered into every project,
# including layering-only ones, and nothing in copier.yaml or _tasks referenced
# it. An ML project has no LLM call to make, so it is the clearest thing to drop:
# gated OFF for the ml_model shape and preserved everywhere else, so this
# introduces the flag without changing any existing render.
include_llm_kit:
  type: bool
  default: "{{ not is_ml_shaped }}"
  when: false

# The eval suite (evals/) grades model interactions — an ML project measures its
# models with ml/evaluation/ and the run registry instead, so the whole eval root
# goes. Its own toggle rather than a bare is_ml_shaped reference in _tasks: the
# eval tree is also what a future non-agentic-but-graded shape would want to keep,
# and `-d include_eval_suite=true` restores it on an ml_model render.
# `or has_corpus_pipeline`: an ml_model render that opts into rag_agent keeps the
# retrieval golden-QA eval staged (evals/pipelines/run.py, graders/citation.py,
# metrics/retrieval.py) — without this clause it is staged and then silently
# discarded with _scaffold/.
include_eval_suite:
  type: bool
  default: "{{ scaffold_full_project and (not is_ml_shaped or has_corpus_pipeline) }}"
  when: false

# core/ is the general ETL home for the corpus/document pipeline that feeds
# retrieval. An ML project's data work lives in ml/transform + ml/feature_engineering
# against a tabular frame, so core/ ships nothing it uses. Same override posture
# as include_eval_suite above — including the has_corpus_pipeline clause: with
# rag_agent opted in, core/pipelines/corpus/ is exactly what core/ is for.
include_core_etl:
  type: bool
  default: "{{ scaffold_full_project and (not is_ml_shaped or has_corpus_pipeline) }}"
  when: false

# The agentic lifecycle docs (LIFECYCLE/DELIVERY/DEPLOYMENT/RELEASE + SANYI) are
# written around gates that read eval evidence and a change contract over agent
# behaviour — none of which an ml_model render produces. DESIGN.md and CLAUDE.md
# are NOT in this set: both are shape-neutral project docs every render keeps.
include_lifecycle_docs:
  type: bool
  default: "{{ scaffold_full_project and not is_ml_shaped }}"
  when: false

# nbks/ used to ride entirely on has_corpus_pipeline — the corpus_analysis.py
# notebook was the only thing in it, so a non-corpus render dropped the whole
# directory. An ML project is the case where notebooks matter MOST (the
# /new ML branch treats the EDA notebook as load-bearing: templated
# code arrives while the operator looks at real data), so the gate becomes the
# union of the two reasons a project has notebooks. Which notebook FILES ship is
# still decided per-reason — see the two _tasks cleanups.
include_notebooks:
  type: bool
  default: "{{ scaffold_full_project and (has_corpus_pipeline or is_ml_shaped) }}"
  when: false

# The run registry (experiments/) is a top-level shared root, not an
# ml_source_root subtree — AI evals consume the same record shape (see
# experiments/record.py), so this does NOT gate on include_ml. Default is
# "on whenever a full scaffold happens", same posture as eval_root, which
# has no off-switch of its own either. It is one of the few roots an ml_model
# render KEEPS: a model comparison is exactly the thing a run registry records.
# It IS gated on the backend language: experiments/ is a Python tree, and the
# _tasks copy step already refuses to stage it for a TS-only backend. Without
# the same guard here the flag stays true for that scaffold and pulls in a
# pandas dependency plus pyright/pythonpath entries for a tree that never lands.
include_run_registry:
  type: bool
  default: "{{ scaffold_full_project and primary_backend_language in ['python', 'both'] }}"
  when: false

# LLM tracing provider for backend/src/observability/ (step 3′). Agentic-only:
# an ml-only project has no LLM calls to trace, so the subtree is removed in
# _tasks when is_agent_shaped is false and this collapses to 'none'.
# The factory file MUST stay named observability.py — .claude/hooks/sdk_lint.sh
# (B3) exempts only that filename from the bare-client-instantiation check, so
# renaming it makes the scaffold flag itself.
observability_provider:
  type: str
  choices:
    langfuse: langfuse
    langsmith: langsmith
    none: none
  default: "{{ 'langfuse' if is_agent_shaped else 'none' }}"
  # A3 invariant: derived, never asked — drive it with
  # -d observability_provider=langsmith.
  when: false

# Guard layers for backend/src/security/ (step 4′). Agentic-only: the three
# layers wrap an LLM turn (untrusted input → prompt → model output), so an
# ml-only project has nothing to guard and the subtree is removed in _tasks.
# Independent of observability_provider — guards don't trace. The output filter
# runs BEFORE observability/tracing.py's redact() so a value the model leaked
# never reaches the tracing backend (CLAUDE.md.jinja, DESIGN.md.jinja).
include_security_guards:
  type: bool
  # Narrower than is_agent_shaped: guards.py's only importers are the lg_agent
  # nodes (guardrail/generate/retrieve). An agent-shaped project with
  # primary_chat_agent=none — project_type=rag is the live case — renders no
  # such nodes, so is_agent_shaped alone shipped the whole security/ layer with
  # nothing able to call it. Caught by scripts/check_imports.py (AIT-51).
  default: "{{ is_agent_shaped and primary_chat_agent in ['lg_agent', 'both'] }}"
  # A3 invariant: derived, never asked — drive it with
  # -d include_security_guards=false.
  when: false

include_calendar_integration:
  type: bool
  default: "{{ 'calendar' in external_systems }}"
  when: false

# Derived per-metric toggles from the eval_metrics multiselect — same pattern
# as the optional_features derivations above.
#
# Gated on has_gradeable_interactions (step 7), which is strictly stronger than
# the scaffold_full_project conjunct these carried before: it still keeps
# layering-only mode from computing a truthy default off the (skipped)
# multiselect's seeded default, AND it makes the gate hold against an EXPLICIT
# override. That second half is the point — `-d eval_metrics=[intent]` on a
# primary_chat_agent=none project would otherwise scaffold an intent grader,
# a registry importing it, and a targets.yaml key, all grading an agent that
# was never rendered. The metric list stays user-selectable; whether ANY
# interaction metric is coherent for the project is not a list question.
include_metric_escalation:
  type: bool
  default: >-
    {{ (has_gradeable_interactions and 'escalation' in _external_data.design.evals.interaction)
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    (has_gradeable_interactions and 'escalation' in eval_metrics) }}
  # Q5 row 10: repoints include_metric_escalation's OWN default directly,
  # bypassing the eval_metrics multiselect. Stage-gated on discovery; else the
  # existing A3-derived 'escalation' in eval_metrics expression, kept verbatim.
  when: false

include_metric_friction:
  type: bool
  default: >-
    {{ (has_gradeable_interactions and 'friction' in _external_data.design.evals.interaction)
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    (has_gradeable_interactions and 'friction' in eval_metrics) }}
  when: false

include_metric_intent:
  type: bool
  default: >-
    {{ (has_gradeable_interactions and 'intent' in _external_data.design.evals.interaction)
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    (has_gradeable_interactions and 'intent' in eval_metrics) }}
  when: false

include_metric_language:
  type: bool
  default: >-
    {{ (has_gradeable_interactions and 'language' in _external_data.design.evals.interaction)
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    (has_gradeable_interactions and 'language' in eval_metrics) }}
  when: false

# Any interaction metric selected → ship the shared machinery (models,
# registry, judges base, grade/sampling/calibration/redaction pipelines,
# report builder/renderer, sample data, tests).
include_interaction_evals:
  type: bool
  default: "{{ include_metric_escalation or include_metric_friction or include_metric_intent or include_metric_language }}"
  when: false

# ─── Phase 4 — Team conventions ───────────────────────────────────────────

data_sensitivity:
  type: str
  help: >-
    What's the most sensitive data this project will touch? Drives a CLAUDE.md
    hard-rule and (when scaffold_full_project) a Terraform resource tag —
    governance should be visible from day one, not bolted on later. Default
    follows your primary-users answer (customer/public-facing -> restricted).
  choices:
    public: "public"
    internal: "internal"
    restricted: "restricted"
    secret: "secret"
  default: >-
    {{ _external_data.design.data_sensitivity
    if (_external_data.design is defined and _external_data.design and
    _external_data.design.stages is defined and
    _external_data.design.stages.discovery == 'complete') else
    ('restricted' if primary_users in ['customers', 'public_api'] else 'internal') }}
  # Q5 (— row, data_sensitivity): direct copy of design.data_sensitivity once
  # discovery is complete (governance decision seeded during Discovery per the
  # design.yaml schema); else the original literal primary_users-derived
  # expression. Stays askable.
  when: false

ticket_prefix:
  type: str
  help: Ticket prefix used for branch naming and linked-issue conventions (e.g. LIN, JIRA, GH)
  default: LIN
  when: false

enable_macos_notifications:
  type: bool
  help: Use macOS notifications (osascript) for Stop/long-test hooks? (turn off on Linux/CI)
  default: "{{ _copier_conf.os == 'macos' }}"
  when: false

agent_config_profile:
  type: str
  help: "Agent harness posture: guarded (full hooks+permissions), independent (full hooks, relaxed permissions), vanilla (no .claude or .agents)"
  choices:
    guarded: guarded
    independent: independent
    vanilla: vanilla
  default: guarded

# ─── Inferred repo configuration (never asked — override with -d) ─────────
# (py_project_root/ai_source_root live above Phase 2 — later help-strings
# interpolate them.)

eval_root:
  type: str
  default: evals
  when: false

eval_allowed_dirs:
  type: str
  default: generation graders metrics pipelines reports utils
  when: false

# Canonical eval-suite directory-layout enforcement — only meaningful for
# eval-suite-shaped repos (eval suites, RAG projects graded against golden
# sets), so it follows project_type instead of being asked.
enable_structure_guard:
  type: bool
  default: "{{ scaffold_full_project and project_type in ['eval_suite', 'rag'] }}"
  when: false

python_version:
  type: str
  default: "3.12"
  when: false

aws_region:
  type: str
  default: eu-central-1
  when: false

expensive_command_patterns:
  type: str
  default: ""
  when: false

# Independent of scaffold_full_project — available in layering-only mode too.
# Legacy name: this once shipped a separate .agents/skills/ library, which was
# folded into .claude/skills/ (the ADK/LangGraph skills there always ship). It
# now gates only .claude/agents/agent_creator.md, the subagent that drives
# those skills. Kept under the old name so existing answers files still apply.
include_agent_reference_library:
  type: bool
  default: false
  when: false

# Maintainer knob: "vendored" ships the code-* skills (code-debug,
# code-refactor, code-review) into the rendered project. "none" removes them.
# The design-* pipeline (initiative/product/system/roadmap) always ships —
# it is template-native, not synced from global.
# sync-global-skills.sh is retired and must not be run.
global_skills_source:
  type: str
  choices:
    vendored: "vendored"
    none: "none"
  default: vendored
  when: false

_tasks:
  - "chmod +x {{ _copier_conf.dst_path }}/.claude/hooks/*.sh 2>/dev/null || true"
  # vanilla profile: no agent harness at all — remove .claude and .agents wholesale.
  # guarded/independent: keep everything; permissions differ in settings.json only.
  - "{{ 'true' if agent_config_profile != 'vanilla' else 'rm -rf ' ~ _copier_conf.dst_path ~ '/.claude ' ~ _copier_conf.dst_path ~ '/.agents' }}"
  - "{{ 'true' if include_mcp_server else 'rm -rf ' ~ _copier_conf.dst_path ~ '/mcp_servers' }}"
  - "{{ 'true' if include_agent_reference_library else 'rm -rf ' ~ _copier_conf.dst_path ~ '/.claude/agents/agent_creator.md' }}"
  # code-* are the only skills gated by global_skills_source. The design-*
  # pipeline (initiative/product/system/roadmap) is template-native and always
  # ships. Demoted skills (workflow-*, git-*, docs-check, new-agent, etc.) were
  # removed from the template 2026-08-27 — they live in the repo that owns
  # their stage (guacamayo for production, galactus for prototyping).
  - >-
    {{ 'true' if global_skills_source == 'vendored' else 'rm -rf ' ~
    _copier_conf.dst_path ~ '/.claude/skills/code-refactor ' ~
    _copier_conf.dst_path ~ '/.claude/skills/code-review ' ~
    _copier_conf.dst_path ~ '/.claude/skills/code-debug' }}
  # dev_companion is .claude-only and guarded on include_* alone (not
  # `(not scaffold_full_project) or ...`): it lives under .claude/, which
  # layering-only mode DOES ship, so the removal must fire there too when the
  # toggle is off — unlike the _scaffold/ cleanups below, which layering mode
  # discards wholesale anyway.
  - "{{ 'true' if include_dev_companion else 'rm -rf ' ~ _copier_conf.dst_path ~ '/.claude/docs/companion' }}"
  # integrations/ sub-modules are independently removable — a blanket rm -rf tied
  # to one toggle would also delete modules gated by the OTHER toggles below.
  # Same staging-path caveat as dev_companion above — integrations/ is staged
  # under _scaffold/{{ py_project_root }}/{{ ai_source_root }}, only moved into place by the big mv task
  # when scaffold_full_project=true.
  - "{{ 'true' if (not scaffold_full_project) or include_n8n_webhook else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/n8n_webhook.py' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_calendar_integration else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/google_calendar.py' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_marketing_integrations else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/eventbrite.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/linkedin.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/canva.py' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_meeting_intelligence else 'rm -rf ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/meeting_intelligence.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/model ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/tests/unit/integrations' }}"
  # If nothing under integrations/ ended up enabled, remove the now-empty package.
  - "{{ 'true' if (not scaffold_full_project) or include_n8n_webhook or include_calendar_integration or include_marketing_integrations or include_meeting_intelligence or include_composio or include_web_research else 'rm -rf ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_ragas_grader else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/ragas_grader.py' }}"
  # Corpus data pipeline (core/pipelines/corpus/) + its retrieval golden-QA eval,
  # tests, example corpus, analysis notebook, and lg_agent's retrieve node +
  # test — shipped only when the corpus demo layer is on (has_corpus_pipeline).
  # Note this removes nbks/corpus_analysis.py, the FILE, not nbks/ the directory:
  # the ML shape also ships notebooks (see include_notebooks), so the directory's
  # own removal moved to its own task below. Removing the dir here would delete
  # the ML EDA notebook on every ml_model render, which has no corpus pipeline.
  # core/ itself (the general ETL home) always ships in a full scaffold; only the
  # corpus SUBpackage and everything welded to it is removed here for a
  # non-retrieval shape. Staged under _scaffold/, removed before the big mv —
  # same pattern as the integration/metric sub-modules above. The three eval
  # files (pipelines/run.py, graders/citation.py, metrics/retrieval.py) are the
  # only eval modules coupled to corpus.models; nothing else imports them, so the
  # remaining eval tree (interaction evals, gated separately) stays intact.
  # pipelines/compare.py ships on the unmerged AIT-29-otel-spans branch; when it
  # rebases, AIT-29 must append compare.py to this rm list and gate its
  # eval-compare Makefile target on has_corpus_pipeline (see issue #29). It is
  # NOT listed here preemptively — tools/template/validate_paths.py rejects _tasks
  # paths with no matching template entry.
  # graders/custom/ goes with run.py: `from evals.graders.custom import all_graders`
  # in run.py is its ONLY importer, so without run.py the custom-grader registry
  # ships into every non-retrieval render with nothing able to invoke it — the
  # plugin hook is documented in its docstring but unreachable. Caught by
  # scripts/check_imports.py (AIT-51) on its first run.
  - >-
    {{ 'true' if (not scaffold_full_project) or has_corpus_pipeline else 'rm -rf '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/core/pipelines/corpus '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/data/raw_corpus '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/tests/unit/core '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/nbks/corpus_analysis.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/custom '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/pipelines/run.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/citation.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/metrics/retrieval.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/agents/' ~ lg_agent_dir ~ '/nodes/retrieve.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/tests/unit/agents/test_retrieve.py' }}
  # terraform/ is an AWS-only IaC skeleton (ECS Fargate + ALB, provider "aws") —
  # sending it to a GCP project would ship the wrong cloud's IaC, which is worse
  # than shipping none. containers/ still ships regardless (Dockerfiles/compose
  # are useful at every cloud target, including none).
  - "{{ 'true' if (not scaffold_full_project) or cloud == 'aws' else 'rm -rf ' ~ _copier_conf.dst_path ~ '/_scaffold/infrastructure/terraform' }}"
  # Interaction-eval metrics: per-metric modules (heuristic + judge + metrics
  # aggregator) are independently removable, same pattern as integrations/
  # sub-modules above — staged under _scaffold/<eval_root>, removed from
  # staging before the big mv.
  - "{{ 'true' if (not scaffold_full_project) or include_metric_escalation else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/heuristic/escalation.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/judges/escalation.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/metrics/escalation.py' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_metric_friction else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/heuristic/friction.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/judges/friction.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/metrics/friction.py' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_metric_intent else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/heuristic/intent.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/judges/intent.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/metrics/intent.py' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_metric_language else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/heuristic/language.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/judges/language.py ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/metrics/language.py' }}"
  # No interaction metric selected → remove the shared machinery wholesale so
  # the eval tree looks exactly like the pre-interaction-evals scaffold
  # (retrieval golden-QA pipeline only).
  - >-
    {{ 'true' if (not scaffold_full_project) or include_interaction_evals else 'rm -rf '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/heuristic '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/judges '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/graders/metrics_registry.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/models.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/metrics/_shared.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/pipelines/grade.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/pipelines/sampling.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/pipelines/calibration.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/pipelines/redaction.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/reports/builder.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ eval_root ~ '/reports/renderer.py '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/data/evals '
    ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/tests/unit/evals/test_interaction_evals.py' }}
  - "{{ 'true' if (not scaffold_full_project) or include_promptfoo else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/promptfoo.config.yaml' }}"
  # cd.yml builds infrastructure/containers/lg_agent/Dockerfile — the only image
  # the template ships — so it needs BOTH a docker/cloud deployment_target and
  # the lg_agent actually scaffolded. Removed from staging before the big mv
  # (same class as the promptfoo cleanup above).
  - "{{ 'true' if (not scaffold_full_project) or (deployment_target in ['docker', 'cloud'] and primary_chat_agent in ['lg_agent', 'both']) else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/.github/workflows/cd.yml' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_composio else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/composio.py' }}"
  - "{{ 'true' if (not scaffold_full_project) or include_web_research else 'rm -f ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ai_source_root ~ '/integrations/web_research.py' }}"
  # The chat-agent trees are staged under _scaffold/ at their rendered
  # {{ lg_agent_dir }}/{{ adk_agent_dir }} names (same reasoning as the
  # cleanups above) — when a framework isn't chosen its dir var falls back to
  # the framework name and the tree is removed here. 'none' removes both,
  # leaving rag_agent (shared retrieval infra for the MCP tool, if included)
  # as the sole example agent.
  # The verification-loop smoke test imports agents.{{ lg_agent_dir }} directly,
  # so it goes with the tree — otherwise it ships into lg-agent-less profiles and
  # fails at import with ModuleNotFoundError (lint hides this: ruff can't resolve
  # the missing module, so it silently reclassifies the import as third-party).
