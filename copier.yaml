  # lands beside the AI source root (backend/ml/ by default) — a sibling of
  # <ai_source_root>, not nested inside it.
  - "{{ ('mkdir -p ' ~ _copier_conf.dst_path ~ '/' ~ py_project_root ~ '/' ~ ml_source_root ~ ' && cp -R ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ ml_source_root ~ '/. ' ~ _copier_conf.dst_path ~ '/' ~ py_project_root ~ '/' ~ ml_source_root ~ '/') if (scaffold_full_project and include_ml and py_project_root != '' and primary_backend_language in ['python', 'both']) else 'true' }}"
  # Separate merge (not part of the block above) — same reasoning as the ml/
  # merge immediately above: the experiments/ cleanup task rm -rf's the whole
  # staged directory when include_run_registry is false, so it may not exist
  # at all. Staged at _scaffold/<py_project_root>/<run_registry_root>/ and
  # lands beside the AI source root — a sibling of <ai_source_root> and
  # <ml_source_root>, not nested inside either (top-level shared root, not
  # ML-only — see include_run_registry above).
  - "{{ ('mkdir -p ' ~ _copier_conf.dst_path ~ '/' ~ py_project_root ~ '/' ~ run_registry_root ~ ' && cp -R ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ py_project_root ~ '/' ~ run_registry_root ~ '/. ' ~ _copier_conf.dst_path ~ '/' ~ py_project_root ~ '/' ~ run_registry_root ~ '/') if (scaffold_full_project and include_run_registry and py_project_root != '' and primary_backend_language in ['python', 'both']) else 'true' }}"
  # scripts/ — Python repo tooling (check_imports.py, the AIT-51 unimported-module
  # guard). Separate merge, not part of the block above: it only belongs in a render
  # with a Python backend, mirroring the ai_source_root merge's own condition. A
  # typescript-only project gets the TS twin (check-unimported.mjs) under its own
  # project root instead. Directory → merge (idempotent on re-render).
  - "{{ ('mkdir -p ' ~ _copier_conf.dst_path ~ '/scripts && cp -R ' ~ _copier_conf.dst_path ~ '/_scaffold/scripts/. ' ~ _copier_conf.dst_path ~ '/scripts/') if (scaffold_full_project and primary_backend_language in ['python', 'both']) else 'true' }}"
  # Same reasoning — railway.toml is rm -f'd above when split_service isn't chosen.
  # (bare file → mv, overwrites fine on re-render)
  - "{{ ('mv ' ~ _copier_conf.dst_path ~ '/_scaffold/railway.toml ' ~ _copier_conf.dst_path ~ '/') if (scaffold_full_project and frontend_backend_topology == 'split_service') else 'true' }}"
  # Same reasoning — promptfoo.config.yaml is rm -f'd by the include_promptfoo
  # cleanup task below when the toggle is off, so it can't be in the block above.
  # (bare file → mv)
  - "{{ ('mv ' ~ _copier_conf.dst_path ~ '/_scaffold/promptfoo.config.yaml ' ~ _copier_conf.dst_path ~ '/') if (scaffold_full_project and include_promptfoo) else 'true' }}"
  # Separate merge (not part of the block above) — ts_project_root only exists
  # when has_typescript is true, and the block's expression is built unconditionally
  # whenever scaffold_full_project is true, so it can't safely reference a variable
  # that might not be defined. This one short-circuits on has_typescript first.
  # split_service's TS side is frontend-only (Next.js, not the Express backend
  # service), so it's excluded here — moved from its own staging dir instead,
  # by the task below.
  # Destination (step 2b′): a typescript-only backend lands at backend/, matching
  # the Python case. Under `both` it keeps its project-named root — Python already
  # owns backend/, and the two would otherwise collide (the uniformity rule's one
  # explicit exception). Staging path is unchanged either way.
  - "{{ ('mkdir -p ' ~ _copier_conf.dst_path ~ '/' ~ ts_project_root ~ ' && cp -R ' ~ _copier_conf.dst_path ~ '/_scaffold/' ~ ts_project_root ~ '/. ' ~ _copier_conf.dst_path ~ '/' ~ ts_project_root ~ '/') if (scaffold_full_project and has_typescript and ts_project_root != '' and primary_backend_language in ['typescript', 'both'] and frontend_backend_topology != 'split_service') else 'true' }}"
  # frontend/ promotion — MUST run before the _scaffold cleanup below, which is
  # why it sits here rather than with the other TS tasks. Promotes atomically
  # (a self-contained frontend tree), same class as the two backend roots.
  # Lands at frontend/ in every topology: split_service differs from single by
  # deploy config (vercel.json, the Supabase-JWT middleware.ts already in the
  # tree), not by which files render.
  #
  # AIT-70: one task per bundler rather than an inline conditional on the source
  # path — validate_paths.py resolves `_scaffold/...` literals statically, and a
  # ternary inside the path reads to it as a directory named "('frontend-vite".
  # Both destinations are plain frontend/, so nothing downstream can tell which
  # bundler was chosen from the path alone.
  - "{{ ('mkdir -p ' ~ _copier_conf.dst_path ~ '/frontend && cp -R ' ~ _copier_conf.dst_path ~ '/_scaffold/frontend/. ' ~ _copier_conf.dst_path ~ '/frontend/') if (scaffold_full_project and include_frontend and frontend_bundler != 'vite') else 'true' }}"
  - "{{ ('mkdir -p ' ~ _copier_conf.dst_path ~ '/frontend && cp -R ' ~ _copier_conf.dst_path ~ '/_scaffold/frontend-vite/. ' ~ _copier_conf.dst_path ~ '/frontend/') if (scaffold_full_project and include_frontend and frontend_bundler == 'vite') else 'true' }}"
  # supabase/ promotion — same class as frontend/: a self-contained tree that
  # lands at the repo root, where the Supabase CLI expects to find it.
  - "{{ ('mkdir -p ' ~ _copier_conf.dst_path ~ '/supabase && cp -R ' ~ _copier_conf.dst_path ~ '/_scaffold/supabase/. ' ~ _copier_conf.dst_path ~ '/supabase/') if (scaffold_full_project and include_supabase_db) else 'true' }}"
  - "rm -rf {{ _copier_conf.dst_path }}/_scaffold"
  # MCP server language: python (FastMCP) and typescript (official MCP TS SDK)
  # are disjoint file trees rendered side by side, then the unchosen one is
  # pruned here. Both land at mcp_servers/<slug>/ — since py_mcp_server_slug and
  # ts_mcp_server_slug both default to mcp_server_slug, the survivor is already
  # at its final path and needs no move. (This replaced an _mcp_ts/ staging tree
  # + mv, removed 2026-07-19: staging was unnecessary once both trees could be
  # rendered under mcp_servers/ directly.)
  - "{{ ('rm -rf ' ~ _copier_conf.dst_path ~ '/mcp_servers/' ~ mcp_server_slug ~ '__unchosen_py ' ~ _copier_conf.dst_path ~ '/mcp_servers/' ~ mcp_server_slug ~ '__unchosen_ts') if include_mcp_server else 'true' }}"

# Migrations run ONLY on `copier update` (never on a fresh copy), after the new
# render lands. Unversioned entries run on every update; the shell guards below
# make each one idempotent (a no-op once the tree is already restructured), so
# no version tag is required — this repo doesn't tag releases yet.
_migrations:
  # core/ → core/pipelines/corpus/ restructure. The old render put the corpus
  # ETL modules at core/*.py; they now live at core/pipelines/corpus/*.py.
  # copier's 3-way merge adds the new paths but leaves the OLD core/*.py behind
  # whenever the developer had edited them (an unmodified file copier deletes
  # cleanly; a hand-edited one it keeps, orphaning it next to the new module and
  # breaking `from core.models import …`). This migration removes each stale
  # top-level module ONLY when (a) its replacement now exists under
  # core/pipelines/corpus/ and (b) the stale file has no uncommitted local
  # edits — a dirty stale file is left in place and flagged, so a developer's
  # work is never silently deleted. Idempotent: once core/*.py is gone it's a
  # no-op. Guarded on `git` being available and the project being a git repo;
  # outside git we can't tell edited from pristine, so we only warn.
  - >-
    sh -c '
    set -e;
    corpus="core/pipelines/corpus";
    [ -d "$corpus" ] || exit 0;
    in_git=0; git rev-parse --is-inside-work-tree >/dev/null 2>&1 && in_git=1;
    for f in README.md __main__.py index.py ingestion.py models.py preprocessing.py; do
      old="core/$f";
      [ -f "$old" ] || continue;
      [ -f "$corpus/$f" ] || continue;
      mod="${f%.py}";
      if [ "$in_git" = 0 ]; then
        echo "[migration] WARN: not a git repo, cannot tell edited from pristine — review $old vs $corpus/$f and remove $old by hand.";
      elif [ -n "$(git status --porcelain -- "$old" 2>/dev/null)" ]; then
        echo "[migration] WARN: $old has local edits, NOT removed — port them into $corpus/$f, delete $old, and repoint any \"from core.$mod import\" references.";
      else
        rm -f "$old" && echo "[migration] removed stale $old (moved to $corpus/$f).";
      fi;
    done
    '
  # DESIGN.md Key Decisions table ← design.yaml (Q7). The table between the
  # design-table markers is a VIEW of design.yaml; the prose around it is
  # human-owned. copier's 3-way merge is the wrong tool here — it would
  # conflict on every prose edit — so instead this rewrites ONLY the bytes
  # between the two markers, leaving all other bytes untouched. The script
  # itself is defensive: missing design.yaml/DESIGN.md, absent or reordered
  # markers, unparseable yaml, or a discovery stage that isn't `complete` all
  # warn and no-op rather than touching the file. Idempotent — re-running with
  # an unchanged design.yaml rewrites identical bytes. Guarded on python3
  # being available; without it the table simply stays as-is.
  - >-
    sh -c '
    [ -f design.yaml ] || exit 0;
    [ -f DESIGN.md ] || exit 0;
    [ -f .claude/scripts/render_design_table.py ] || exit 0;
    command -v python3 >/dev/null 2>&1 || {
      echo "[migration] WARN: python3 not found — DESIGN.md decisions table not regenerated from design.yaml.";
      exit 0;
    };
    python3 .claude/scripts/render_design_table.py .
    '
